bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection
bind v split-window -h -p 65
bind x kill-pane 
bind k kill-window
bind c new-window
bind r command-prompt "rename-window '%%'"

set-option -g status-position top
set -g mode-keys vi
set -g mouse on

# Status line
set -g status-position top
set -g status-style "bg=colour235,fg=colour245"

set -g status-left-length 20
set -g status-left "#[fg=colour141,bold] #S "

set -g window-status-format " #[fg=colour245]#I:#W "
set -g window-status-current-format "#[fg=colour110,bold] #I:#W "

set -g window-status-separator "│"

set -g status-right "#[fg=colour245]%H:%M  %d-%b-%y "

